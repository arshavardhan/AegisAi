[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisai"
version = "0.1.0"
description = "A lightweight reliability and trust layer for machine-learning predictions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}

authors = [
    {name = "Harsha Vardhan"}
]

dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
]

[project.urls]
Homepage = "https://github.com/arshavardhan/AegisAi"
Repository = "https://github.com/arshavardhan/AegisAi"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
